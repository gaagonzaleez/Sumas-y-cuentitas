<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3EEFF; font-family: 'Nunito', sans-serif; color: #2B2350; display: flex; flex-direction: column; padding: 40px 24px 32px 24px; gap: 20px; overflow: hidden">

      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 100 100"><path d="M50 6 L61 38 L95 38 L67 58 L78 92 L50 72 L22 92 L33 58 L5 38 L39 38 Z" fill="#FFC93C" stroke="#2B2350" stroke-width="5" stroke-linejoin="round"/><circle cx="42" cy="50" r="3.5" fill="#2B2350"/><circle cx="58" cy="50" r="3.5" fill="#2B2350"/><path d="M43 60 Q50 67 57 60" fill="none" stroke="#2B2350" stroke-width="4" stroke-linecap="round"/></svg>
      <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; line-height: 1; color: #5B3FE0">Sumas y<br>Cuentitas</div>
    </div>
    <div style="background: #FFFFFF; border: 2px solid #5B3FE0; color: #5B3FE0; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 13px">Para mamá o papá</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
    <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1">Creá el perfil de tu hija</h1>

      <input id="apodo" type="text" value="Estrellita" style="height: 52px; box-sizing: border-box; border: 2px solid #CFC6F5; border-radius: 14px; padding: 0 16px; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: #2B2350; background: #FBFAFF">
      <span style="font-size: 13px; color: #5E5780; font-weight: 600">No uses su nombre real ni apellido.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="codigo" style="font-weight: 800; font-size: 15px">Código del grupo</label>
      <input id="codigo" type="text" value="LUNA-4821" style="height: 52px; box-sizing: border-box; border: 2px solid #CFC6F5; border-radius: 14px; padding: 0 16px; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 2px; color: #2B2350; background: #FBFAFF">
      <span style="font-size: 13px; color: #5E5780; font-weight: 600">Te lo pasó quien armó el grupo. Si no tenés, podés jugar sin grupo.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="grado" style="font-weight: 800; font-size: 15px">Grado</label>
      <select id="grado" style="height: 52px; box-sizing: border-box; border: 2px solid #CFC6F5; border-radius: 14px; padding: 0 12px; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: #2B2350; background: #FBFAFF">
        <option>2.º grado</option>
        <option>1.º grado</option>
        <option>3.º grado</option>
      </select>
    </div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 0 4px">
    <input id="ok" type="checkbox" checked style="width: 24px; height: 24px; margin: 2px 0 0 0; accent-color: #5B3FE0; flex: none">
    <label for="ok" style="font-size: 14px; line-height: 1.4; font-weight: 600; color: #2B2350">Acepto que mi hija juegue con apodo y avatar, sin fotos ni datos personales.</label>
  </div>

  <div style="flex: 1"></div>

  <button type="button" style="height: 60px; border: none; border-radius: 20px; background: #5B3FE0; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; box-shadow: 0 5px 0 #3A22A8">Crear perfil</button>
