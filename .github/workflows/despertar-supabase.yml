name: Mantener despierto Supabase

# El plan gratuito de Supabase pausa el proyecto tras 7 días sin uso.
# Esta acción gratuita le hace una consulta mínima cada 3 días.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLAVE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CLAVE" ]; then echo "Supabase todavía no está configurado (ver NECESITO_DE_GA.md)."; exit 0; fi
          curl -sS -f -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $CLAVE" -H "Authorization: Bearer $CLAVE" -H "Content-Type: application/json" -d '{}'
