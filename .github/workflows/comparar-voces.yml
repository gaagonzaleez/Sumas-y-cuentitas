name: Comparar voces

# Genera las mismas frases con varias voces gratuitas y las publica en /muestras-voz/
# para elegir la que suene más natural.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/voz/comparar.py'
      - '.github/workflows/comparar-voces.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comparar-voces
  cancel-in-progress: true

jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cambios: ${{ steps.commit.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar voces
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg rubberband-cli
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts piper-tts==1.3.0 kokoro-onnx==0.4.9 soundfile
      - uses: actions/cache@v4
        with:
          path: |
            scripts/voz/.modelos
            ~/.cache/huggingface
          key: modelos-comparar-v1
      - name: Generar muestras
        run: python scripts/voz/comparar.py
      - name: Guardar en el repo
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/muestras-voz
          if git diff --cached --quiet; then echo "cambios=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Muestras de voces para comparar"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep $((i*5)); done
          echo "cambios=si" >> "$GITHUB_OUTPUT"

  desplegar:
    needs: muestras
    if: needs.muestras.outputs.cambios == 'si'
    uses: ./.github/workflows/ci-despliegue.yml
    with:
      ref: main
    secrets: inherit
